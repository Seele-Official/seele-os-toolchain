platforms = ["linux-64"]
preview = ["pixi-build"]

[workspace.build-variants]
c_stdlib = ["sysroot"]
c_stdlib_version = ["2.28"]

[package]
name = "riscv64-unknown-elf-gcc"
version = "16.2.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.4.*", channels = ["conda-forge"] }
