[workspace]
name = "riscv64-unknown-elf-libstdcxx-recipe"
# Prefer a locally built compiler in ../../dist when doing a full from-scratch
# build, and fall back to the published prefix.dev channel so this package can
# also be rebuilt standalone.
channels = [
    "../../dist",
    "https://prefix.dev/seele-official/seele-os-toolchain",
    "conda-forge",
]
platforms = ["linux-64"]
preview = ["pixi-build"]

[package]
name = "riscv64-unknown-elf-libstdcxx"
version = "16.2.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.4.*", channels = ["conda-forge"] }
